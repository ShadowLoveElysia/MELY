[package]
name = "mely"
version = "1.0.0"
description = "MMD to Minecraft projection workstation"
authors = ["MELY"]
edition = "2021"
default-run = "mely"

[lib]
name = "mely_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "verify-native-real-4064"
path = "src/verify-native-real-4064.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
flate2 = "1.1"
num_cpus = "1.17"
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Storage_FileSystem",
  "Win32_System_SystemInformation",
] }
