[package]
name = "mely"
version = "0.2.0"
description = "MMD to Minecraft projection workstation"
authors = ["MELY"]
edition = "2021"

[lib]
name = "mely_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
